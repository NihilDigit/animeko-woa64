name: WOA64 CI Orchestrator

on:
  workflow_dispatch:
    inputs:
      anitorrent_ref:
        description: "anitorrent ref to build"
        required: true
        default: "woa"
        type: string
      animeko_ref:
        description: "animeko ref to build"
        required: true
        default: "woa"
        type: string
      release_version:
        description: "Animeko version used for readable release names"
        required: true
        default: "5.7.0"
        type: string
      anitorrent_version:
        description: "Maven version expected by animeko for org.openani.anitorrent:anitorrent-native-desktop"
        required: true
        default: "0.2.0"
        type: string
      anitorrent_run_id:
        description: "Existing anitorrent workflow run id to reuse instead of dispatching"
        required: false
        default: ""
        type: string
      run_anitorrent:
        description: "Trigger anitorrent and stage its Windows ARM64 runtime"
        required: true
        default: true
        type: boolean
      run_animeko:
        description: "Trigger animeko with the staged anitorrent mock Maven repository when needed"
        required: true
        default: true
        type: boolean
      animeko_run_id:
        description: "Existing animeko workflow run id to reuse instead of dispatching"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish the Animeko Windows ARM64 portable artifact as a prerelease"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag to create when publish_release is enabled; defaults to v<release_version>-woa64"
        required: false
        default: ""
        type: string
      release_title:
        description: "Release title to use when publish_release is enabled; defaults to <release_version> WoA64"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  orchestrate:
    name: Build upstream-style WOA64 chain
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANITORRENT_REPO: NihilDigit/anitorrent
      ANIMEKO_REPO: NihilDigit/animeko
      WORKFLOW_FILE: build.yml
      MOCK_MAVEN_ARTIFACT: mock-maven-woa64
      GH_TOKEN: ${{ secrets.WOA64_CI_TOKEN }}

    steps:
      - name: Checkout meta repository
        uses: actions/checkout@v4

      - name: Check orchestration token
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "Set the WOA64_CI_TOKEN secret. The default GITHUB_TOKEN cannot dispatch workflows in the fork repositories."
          }

      - name: Trigger anitorrent CI
        id: anitorrent
        if: ${{ inputs.run_anitorrent && inputs.anitorrent_run_id == '' }}
        shell: pwsh
        run: |
          $runId = .\.github\workflows\scripts\dispatch-and-wait.ps1 `
            -Repo $env:ANITORRENT_REPO `
            -Workflow $env:WORKFLOW_FILE `
            -Ref "${{ inputs.anitorrent_ref }}"
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download anitorrent artifact
        if: ${{ inputs.run_anitorrent }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/anitorrent | Out-Null
          $runId = "${{ inputs.anitorrent_run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            $runId = "${{ steps.anitorrent.outputs.run_id }}"
          }
          gh run download "$runId" `
            --repo $env:ANITORRENT_REPO `
            --name anitorrent-windows-arm64 `
            --dir artifacts/anitorrent

      - name: Prepare mocked Maven repository
        if: ${{ inputs.run_anitorrent }}
        shell: pwsh
        run: |
          ./.github/workflows/scripts/prepare-mock-maven.ps1 `
            -AnitorrentArtifacts artifacts/anitorrent `
            -OutputDirectory mock-maven `
            -AnitorrentVersion "${{ inputs.anitorrent_version }}"

      - name: Upload mocked Maven repository
        if: ${{ inputs.run_anitorrent }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOCK_MAVEN_ARTIFACT }}
          path: mock-maven
          if-no-files-found: error

      - name: Trigger animeko CI
        id: animeko
        if: ${{ inputs.run_animeko && inputs.animeko_run_id == '' }}
        shell: pwsh
        run: |
          $fields = @()
          if ("${{ inputs.run_anitorrent }}" -eq "true") {
            $fields += @(
              "mock_maven_repo=${{ github.repository }}",
              "mock_maven_run_id=${{ github.run_id }}",
              "mock_maven_artifact=$env:MOCK_MAVEN_ARTIFACT"
            )
          }

          $dispatchArgs = @{
            Repo = $env:ANIMEKO_REPO
            Workflow = $env:WORKFLOW_FILE
            Ref = "${{ inputs.animeko_ref }}"
          }
          if ($fields.Count -gt 0) {
            $dispatchArgs.Field = $fields
          }

          $runId = .\.github\workflows\scripts\dispatch-and-wait.ps1 @dispatchArgs
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve Animeko run id
        id: animeko-run
        if: ${{ inputs.run_animeko }}
        shell: pwsh
        run: |
          $runId = "${{ inputs.animeko_run_id }}"
          if ([string]::IsNullOrWhiteSpace($runId)) {
            $runId = "${{ steps.animeko.outputs.run_id }}"
          }
          if ([string]::IsNullOrWhiteSpace($runId)) {
            throw "Animeko run id was not provided and the trigger step did not produce one."
          }
          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download Animeko Windows ARM64 portable artifact
        if: ${{ inputs.run_animeko && inputs.publish_release }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/animeko | Out-Null
          gh run download "${{ steps.animeko-run.outputs.run_id }}" `
            --repo $env:ANIMEKO_REPO `
            --name ani-windows-aarch64-portable `
            --dir artifacts/animeko

      - name: Package Animeko Windows ARM64 portable artifact
        if: ${{ inputs.run_animeko && inputs.publish_release }}
        shell: bash
        run: |
          version="${{ inputs.release_version }}"
          cd artifacts/animeko
          zip -r -q "../Ani-${version}-woa64-windows-aarch64-portable.zip" Ani

      - name: Publish Animeko Windows ARM64 prerelease
        if: ${{ inputs.run_animeko && inputs.publish_release }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.release_version }}"
          $upstreamTag = if ($version.StartsWith("v")) { $version } else { "v$version" }

          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "$upstreamTag-woa64"
          }

          $title = "${{ inputs.release_title }}"
          if ([string]::IsNullOrWhiteSpace($title)) {
            $title = "$version WoA64"
          }

          $asset = "artifacts/Ani-$version-woa64-windows-aarch64-portable.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash
          $notes = @"
          Windows ARM64 portable build for Animeko $version.

          Source runs:
          - Meta orchestrator: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Animeko build: https://github.com/$env:ANIMEKO_REPO/actions/runs/${{ steps.animeko-run.outputs.run_id }}

          Source refs:
          - anitorrent: ${{ inputs.anitorrent_ref }}
          - animeko: ${{ inputs.animeko_ref }} based on upstream $upstreamTag
          - mediamp: upstream artifacts resolved by Animeko

          Validation:
          - Animeko WoA64 build completed successfully.
          - Desktop package uploaded successfully.
          - Verification job downloaded the Windows ARM64 portable artifact and ran the packaged native smoke tests.

          SHA256:
          $hash
          "@

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title $title `
              --notes $notes `
              --prerelease
          }
