name: WOA64 Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to create/update a draft GitHub Release, for example v5.5.0-woa64. Leave empty for artifact-only builds."
        required: false
        type: string
  push:
    branches:
      - woa
      - main
    tags:
      - "v*"
      - "woa64-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Animeko Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 240

    env:
      JBR_URL: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.10-windows-aarch64-b1163.110.tar.gz
      JBR_CHECKSUM_URL: https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.10-windows-aarch64-b1163.110.tar.gz.checksum
      GRADLE_ARGS: |
        --scan
        --stacktrace
        -Porg.gradle.daemon.idletimeout=60000
        -Dfile.encoding=UTF-8
        -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx4g
        -Dkotlin.daemon.jvm.options=-Xmx4g
        -Pkotlin.native.enableKlibsCrossCompilation=false
        -Pkotlin.native.ignoreDisabledTargets=true

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout submodules over HTTPS
        shell: pwsh
        run: |
          git submodule set-url animeko https://github.com/NihilDigit/animeko.git
          git submodule set-url mediamp https://github.com/NihilDigit/mediamp.git
          git submodule set-url anitorrent https://github.com/NihilDigit/anitorrent.git
          git submodule update --init --recursive

      - name: Setup JDK 17 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
          architecture: aarch64

      - name: Remember JDK 17 toolchain
        shell: pwsh
        run: |
          "JDK17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Get JBR
        id: jbr
        shell: pwsh
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          python .github/workflows/download_jbr.py

      - name: Setup JBR 21
        uses: gmitch215/setup-java@6d2c5e1f82f180ae79f799f0ed6e3e5efb4e664d
        with:
          java-version: "21"
          distribution: jdkfile
          jdkFile: ${{ steps.jbr.outputs.jbrLocation }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure JBR for Compose
        shell: pwsh
        run: |
          # WoA-only: Animeko's Windows x64 workflow downloads JBR/JCEF too; this one points Compose at the aarch64 JCEF runtime.
          "ANI_COMPOSE_JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $jdk17Home = $env:JDK17_HOME.Replace('\','/')
          $jbrHome = $env:JAVA_HOME.Replace('\','/')
          @(
            "GRADLE_ARGS<<EOF"
            $env:GRADLE_ARGS.TrimEnd()
            "-Dorg.gradle.java.installations.paths=$jdk17Home,$jbrHome"
            "EOF"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: pwsh
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup MSYS2 clangarm64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-lld
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-nasm
            mingw-w64-clang-aarch64-openssl
            mingw-w64-clang-aarch64-ca-certificates

      - name: Export MSYS2 root
        shell: pwsh
        run: |
          # WoA-only: windows-11-arm does not currently provide C:\msys64, while upstream Windows x64 runners do.
          $msys2Root = "${{ steps.msys2.outputs['msys2-location'] }}"
          "MSYS2_ROOT=$msys2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$msys2Root\clangarm64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup vcpkg cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
        run: |
          # Matches upstream Windows dependency setup, but installs the arm64 triplet on the WoA runner.
          if (!(Test-Path C:\vcpkg\.git)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          }
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install openssl:arm64-windows
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Install SWIG 4.2.1
        shell: pwsh
        run: |
          # WoA-only: keep SWIG pinned in this meta workflow while the PR branch diff is being minimized.
          $swigZip = Join-Path $env:RUNNER_TEMP "swigwin-4.2.1.zip"
          $swigRoot = Join-Path $env:RUNNER_TEMP "swig"
          curl.exe -L --fail --retry 3 --output $swigZip "https://downloads.sourceforge.net/project/swig/swigwin/swigwin-4.2.1/swigwin-4.2.1.zip"
          Expand-Archive -Path $swigZip -DestinationPath $swigRoot -Force
          if (!(Test-Path "$swigRoot\swigwin-4.2.1\swig.exe")) {
            throw "SWIG executable was not extracted"
          }
          "SWIG_EXE=$swigRoot\swigwin-4.2.1\swig.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install VLC Windows ARM64 app resources
        shell: pwsh
        run: |
          # WoA-only: keep VLC out of the Animeko PR branch and inject the runtime from the meta release workflow.
          $vlcVersion = "3.0.23"
          $vlcName = "vlc-$vlcVersion-winarm64"
          $vlcUrl = "https://download.videolan.org/pub/videolan/vlc/$vlcVersion/winarm64/$vlcName.zip"
          $zip = Join-Path $env:RUNNER_TEMP "$vlcName.zip"
          $sha = Join-Path $env:RUNNER_TEMP "$vlcName.zip.sha256"
          $extractDir = Join-Path $env:RUNNER_TEMP "vlc-winarm64"
          curl.exe -L --fail --retry 3 --output $zip $vlcUrl
          curl.exe -L --fail --retry 3 --output $sha "$vlcUrl.sha256"
          $expected = (Get-Content $sha -Raw).Trim().Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "VLC checksum mismatch. Expected $expected but got $actual"
          }
          Expand-Archive -Path $zip -DestinationPath $extractDir -Force
          $source = Get-ChildItem $extractDir -Directory | Select-Object -First 1
          if ($null -eq $source) {
            throw "VLC archive did not contain an application directory"
          }
          $target = "animeko\app\desktop\appResources\windows-arm64\lib"
          if (Test-Path $target) {
            Remove-Item -LiteralPath $target -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          Copy-Item -LiteralPath $source.FullName -Destination $target -Recurse -Force

      - name: Configure local properties
        shell: pwsh
        run: |
          @(
            "sdk.dir=$($env:ANDROID_HOME.Replace('\','/'))"
            "ani.desktop.proguard=false"
            "jvm.toolchain.version=21"
          ) | Set-Content -Path animeko\local.properties -Encoding utf8
          @(
            "sdk.dir=$($env:ANDROID_HOME.Replace('\','/'))"
            "msys2.dir=$($env:MSYS2_ROOT.Replace('\','/'))"
            "jvm.toolchain.version=21"
          ) | Set-Content -Path mediamp\local.properties -Encoding utf8
          @(
            "sdk.dir=$($env:ANDROID_HOME.Replace('\','/'))"
            "SWIG=$($env:SWIG_EXE.Replace('\','/'))"
            "CMAKE_BUILD_TYPE=Release"
            "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
            "ani.publishing.onlyHostOS=true"
            "jvm.toolchain.version=21"
          ) | Set-Content -Path anitorrent\local.properties -Encoding utf8

      - name: Resolve Animeko dependencies
        shell: pwsh
        working-directory: animeko
        continue-on-error: true
        timeout-minutes: 180
        run: |
          $gradleArgs = $env:GRADLE_ARGS -split "`n" | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }
          .\gradlew.bat --no-configuration-cache @gradleArgs

      - name: Build anitorrent native runtime
        shell: pwsh
        working-directory: anitorrent
        timeout-minutes: 180
        run: |
          $gradleArgs = $env:GRADLE_ARGS -split "`n" | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }
          .\gradlew.bat :anitorrent-native:copyNativeJarForCurrentPlatform --console=plain --no-configuration-cache @gradleArgs

      - name: Build mediamp FFmpeg runtime
        shell: pwsh
        working-directory: mediamp
        timeout-minutes: 180
        run: |
          $gradleArgs = $env:GRADLE_ARGS -split "`n" | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }
          .\gradlew.bat :mediamp-ffmpeg:ffmpegRuntimeJarWindowsArm64 --console=plain --no-configuration-cache @gradleArgs

      - name: Prepare local WoA64 artifacts for Animeko
        shell: pwsh
        run: |
          # WoA-only: publish locally-built runtimes under Animeko's normal dependency coordinates until upstream artifacts exist.
          $localRepo = Join-Path $PWD ".local-maven"
          $sqliteJar = Join-Path $PWD ".tools\sqlite-bundled-jvm-windows-arm64\sqlite-bundled-jvm-windows-arm64.jar"
          $anitorrentJar = Get-ChildItem "anitorrent\anitorrent-native\build\native-jars" -Filter "anitorrent-native-*-windows-arm64.jar" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $mediampJar = Get-ChildItem "mediamp\mediamp-ffmpeg\build\libs" -Filter "mediamp-ffmpeg-runtime-*-windows-arm64.jar" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $anitorrentJar) { throw "Anitorrent Windows ARM64 runtime jar was not found." }
          if ($null -eq $mediampJar) { throw "mediamp FFmpeg Windows ARM64 runtime jar was not found." }
          if (!(Test-Path $sqliteJar)) { throw "SQLite Windows ARM64 JNI jar was not found: $sqliteJar" }

          $mediampVersion = (Select-String -Path "animeko\gradle\libs.versions.toml" -Pattern '^mediamp\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $anitorrentCatalog = (Select-String -Path "animeko\settings.gradle.kts" -Pattern 'org\.openani\.anitorrent:catalog:([^"]+)').Matches[0].Groups[1].Value

          function Write-MavenArtifact {
            param(
              [string]$GroupId,
              [string]$ArtifactId,
              [string]$Version,
              [string]$JarPath,
              [string]$Classifier = ""
            )
            $groupPath = $GroupId.Replace('.', '\')
            $artifactDir = Join-Path $localRepo "$groupPath\$ArtifactId\$Version"
            New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
            $suffix = if ($Classifier) { "-$Classifier" } else { "" }
            Copy-Item -LiteralPath $JarPath -Destination (Join-Path $artifactDir "$ArtifactId-$Version$suffix.jar") -Force
            @"
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>$GroupId</groupId>
            <artifactId>$ArtifactId</artifactId>
            <version>$Version</version>
          </project>
          "@ | Set-Content -Path (Join-Path $artifactDir "$ArtifactId-$Version.pom") -Encoding utf8
          }

          Write-MavenArtifact `
            -GroupId "org.openani.anitorrent" `
            -ArtifactId "anitorrent-native-desktop" `
            -Version $anitorrentCatalog `
            -JarPath $anitorrentJar.FullName `
            -Classifier "windows-arm64"
          Write-MavenArtifact `
            -GroupId "org.openani.mediamp" `
            -ArtifactId "mediamp-ffmpeg-runtime-windows-arm64" `
            -Version $mediampVersion `
            -JarPath $mediampJar.FullName

          $repoUri = (Get-Item $localRepo).FullName.Replace('\','/')
          $sqliteUri = (Get-Item $sqliteJar).FullName.Replace('\','/')
          $initScript = Join-Path $env:RUNNER_TEMP "animeko-woa64-local-artifacts.gradle"
          @"
          gradle.beforeSettings { settings ->
              settings.dependencyResolutionManagement.repositories {
                  maven {
                      name = 'woa64Local'
                      url = uri('file:///$repoUri')
                  }
              }
          }

          allprojects {
              repositories {
                  maven {
                      name = 'woa64Local'
                      url = uri('file:///$repoUri')
                  }
              }
          }

          gradle.projectsEvaluated {
              def desktop = gradle.rootProject.findProject(':app:desktop')
              if (desktop != null) {
                  desktop.dependencies.add('runtimeOnly', desktop.files('$sqliteUri'))
              }
          }
          "@ | Set-Content -Path $initScript -Encoding utf8
          "ANIMEKO_WOA64_INIT=$initScript" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile Animeko desktop
        shell: pwsh
        working-directory: animeko
        timeout-minutes: 180
        run: |
          $gradleArgs = $env:GRADLE_ARGS -split "`n" | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }
          .\gradlew.bat -I "$env:ANIMEKO_WOA64_INIT" compileKotlin compileCommonMainKotlinMetadata compileJvmMainKotlinMetadata compileKotlinDesktop compileKotlinMetadata --console=plain --no-configuration-cache @gradleArgs

      - name: Build Animeko release distributable
        shell: pwsh
        working-directory: animeko
        timeout-minutes: 180
        run: |
          $gradleArgs = $env:GRADLE_ARGS -split "`n" | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }
          .\gradlew.bat -I "$env:ANIMEKO_WOA64_INIT" createReleaseDistributable --console=plain --no-configuration-cache @gradleArgs

      - name: Package portable zip
        id: package
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (!$tag -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag) {
            $version = $tag -replace '^v', ''
          } else {
            $version = "run-${{ github.run_number }}"
          }
          $distDir = Join-Path $PWD ".dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $zip = Join-Path $distDir "ani-$version-windows-aarch64.zip"
          Compress-Archive -Path "animeko\app\desktop\build\compose\binaries\main-release\app\*" -DestinationPath $zip -Force
          $sha1 = "$zip.sha1"
          (Get-FileHash $zip -Algorithm SHA1).Hash.ToLowerInvariant() | Set-Content -Path $sha1 -Encoding ascii
          "zipPath=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha1Path=$sha1" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "releaseTag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-windows-arm64
          path: animeko/app/desktop/build/compose/logs

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: ani-windows-aarch64-portable
          path: |
            ${{ steps.package.outputs.zipPath }}
            ${{ steps.package.outputs.sha1Path }}
          if-no-files-found: error
          overwrite: true

      - name: Create or update draft release
        if: steps.package.outputs.releaseTag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.package.outputs.releaseTag }}"
          $zip = "${{ steps.package.outputs.zipPath }}"
          $sha1 = "${{ steps.package.outputs.sha1Path }}"
          $version = $tag -replace '^v', ''
          $title = "$version"
          $notes = @"
          Windows ARM64 portable build for Animeko.

          This repository temporarily hosts WoA64 builds while upstream support is being prepared. Other platforms are intentionally built and released by upstream Animeko.
          "@

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sha1 --clobber --repo "${{ github.repository }}"
          } else {
            $args = @(
              "release", "create", $tag, $zip, $sha1,
              "--draft",
              "--title", $title,
              "--notes", $notes,
              "--target", "${{ github.sha }}",
              "--repo", "${{ github.repository }}"
            )
            if ($tag.Contains("-")) {
              $args += "--prerelease"
            }
            gh @args
          }
